services:
  keigen-bot:
    build: .
    env_file: .env
    environment:
      - REDIS_HOST=keigen-redis
    depends_on:
      - keigen-redis
    restart: unless-stopped

  keigen-redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
